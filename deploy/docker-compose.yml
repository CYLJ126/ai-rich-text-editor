name: ai-rich-text-editor

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-arte_root_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-arte}
      MYSQL_USER: ${MYSQL_USER:-arte}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-arte_mysql_2026}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      - content-init-state:/var/lib/mysql-files/content-init-state
      - ./mysql/init/00-create-databases.sql:/docker-entrypoint-initdb.d/00-create-databases.sql:ro
      - ./mysql/sql/arte-base-ddl-mysql.sql:/docker-entrypoint-initdb.d/10-arte-base-ddl-mysql.sql:ro
      - ./mysql/sql/arte-home-ddl-mysql.sql:/docker-entrypoint-initdb.d/20-arte-home-ddl-mysql.sql:ro
      - ./mysql/sql/arte-home-dml-mysql.sql:/docker-entrypoint-initdb.d/30-arte-home-dml-mysql.sql:ro
      - ./mysql/sql/arte-rbac-ddl-mysql.sql:/docker-entrypoint-initdb.d/40-arte-rbac-ddl-mysql.sql:ro
      - ./mysql/sql/arte-rbac-dml-mysql.sql:/docker-entrypoint-initdb.d/50-arte-rbac-dml-mysql.sql:ro
      - ./mysql/sql/arte-ai-ddl-mysql.sql:/docker-entrypoint-initdb.d/60-arte-ai-ddl-mysql.sql:ro
      - ./mysql/sql/arte-rt-ddl-mysql.sql:/docker-entrypoint-initdb.d/70-arte-rt-ddl-mysql.sql:ro
      - ./mysql/init/75-stage-public-docs.sh:/docker-entrypoint-initdb.d/75-stage-public-docs.sh:ro
      - ./mysql/sql/arte-public-docs-dml-mysql.sql:/docker-entrypoint-initdb.d/80-arte-public-docs-dml-mysql.sql:ro
      - ../docs/public/118-ARTE简介.md:/arte-docs/arte-intro.md:ro
      - ../docs/public/119-ARTE全部特性.md:/arte-docs/arte-features.md:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: ${ARTE_REGISTRY:-ghcr.io/cylj126}/${ARTE_IMAGE_NAME:-ai-rich-text-editor}-elasticsearch:${ARTE_VERSION:-latest}
    restart: unless-stopped
    environment:
      node.name: es01
      cluster.name: arte
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-arte_elastic_2026}
      xpack.security.enabled: "true"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
      TZ: ${TZ:-Asia/Shanghai}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$${ELASTIC_PASSWORD} 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 30s

  drawio:
    image: jgraph/drawio:31.4.2
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}

  backend:
    image: ${ARTE_REGISTRY:-ghcr.io/cylj126}/${ARTE_IMAGE_NAME:-ai-rich-text-editor}-backend:${ARTE_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx2g}
      SERVER_PORT: 12636
      SERVER_SERVLET_CONTEXT_PATH: /arte
      SPRING_APPLICATION_NAME: AIRichTextEditor
      LOGGING_CONFIG: classpath:log4j2.xml
      SPRING_DATASOURCE_DRUID_APP_URL: ${APP_DB_URL:-jdbc:mysql://mysql:3306/arte?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
      SPRING_DATASOURCE_DRUID_APP_USERNAME: ${MYSQL_USER:-arte}
      SPRING_DATASOURCE_DRUID_APP_PASSWORD: ${MYSQL_PASSWORD:-arte_mysql_2026}
      SPRING_DATASOURCE_DRUID_CHLOROPHYLL_URL: ${CHLOROPHYLL_DB_URL:-jdbc:mysql://mysql:3306/nip?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
      SPRING_DATASOURCE_DRUID_CHLOROPHYLL_USERNAME: ${MYSQL_USER:-arte}
      SPRING_DATASOURCE_DRUID_CHLOROPHYLL_PASSWORD: ${MYSQL_PASSWORD:-arte_mysql_2026}
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-arte_elastic_2026}
      ELASTICSEARCH_INDEX_DOCUMENT_SHARDS: 1
      ELASTICSEARCH_INDEX_DOCUMENT_REPLICAS: 0
      ELASTICSEARCH_INDEX_CHUNK_SHARDS: 1
      ELASTICSEARCH_INDEX_CHUNK_REPLICAS: 0
      REDIS_ADDRESS: redis://redis:6379
      REDIS_PASSWORD: ""
      SPRING_AI_EMBEDDING_PROVIDER: bge-small
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.ai.model.transformers.autoconfigure.TransformersEmbeddingModelAutoConfiguration
      SPRING_AI_DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-not-configured}
      JWT_BASE64_SECRET_KEY: ${JWT_BASE64_SECRET_KEY:-}
      JWT_DEFAULT_PASSWORD: ${JWT_DEFAULT_PASSWORD:-arte@2026}
      SECURITY_SM2_PRIVATEKEY: ${SECURITY_SM2_PRIVATE_KEY:-}
      SECURITY_SM2_PUBLICKEY: ${SECURITY_SM2_PUBLIC_KEY:-}
      RICH_TEXT_STORAGE_TYPE: LOCAL
      RICH_TEXT_STORAGE_LOCAL_IMAGE_PATH: /app/data/uploads/richtext/images
      RICH_TEXT_STORAGE_LOCAL_FILE_PATH: /app/data/uploads/richtext/files
      HTTP_PROXY_HOST: ${HTTP_PROXY_HOST:-}
      HTTP_PROXY_PORT: ${HTTP_PROXY_PORT:-0}
    volumes:
      - backend-logs:/usr/local/data/log/AIRichTextEditor
      - backend-uploads:/app/data/uploads
      - backend-secrets:/app/secrets
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "-X", "POST", "-H", "Connection: close", "-o", "/dev/null", "http://127.0.0.1:12636/arte/auth/getPubKey"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 45s

  frontend:
    image: ${ARTE_REGISTRY:-ghcr.io/cylj126}/${ARTE_IMAGE_NAME:-ai-rich-text-editor}-frontend:${ARTE_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      content-index-init:
        condition: service_completed_successfully
      drawio:
        condition: service_started
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-50m}
      NGINX_BACKEND_UPSTREAM: http://backend:12636
      NGINX_DRAWIO_UPSTREAM: http://drawio:8080
      NGINX_ROOT_REDIRECT: ${NGINX_ROOT_REDIRECT:-/Writing/BasicWriting}
      NGINX_SPA_FALLBACK: ${NGINX_SPA_FALLBACK:-/Welcome/index.html}
    ports:
      - "${ARTE_BIND_ADDRESS:-0.0.0.0}:${ARTE_PORT:-8000}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 20

  content-index-init:
    image: ${ARTE_REGISTRY:-ghcr.io/cylj126}/${ARTE_IMAGE_NAME:-ai-rich-text-editor}-elasticsearch:${ARTE_VERSION:-latest}
    restart: "no"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-arte_elastic_2026}
    entrypoint: ["sh", "/init/init-public-docs.sh"]
    volumes:
      - ./elasticsearch/init-public-docs.sh:/init/init-public-docs.sh:ro
      - ./elasticsearch/public-docs.ndjson:/init/public-docs.ndjson:ro
      - content-init-state:/init-state

  elasticsearch-setup:
    image: ${ARTE_REGISTRY:-ghcr.io/cylj126}/${ARTE_IMAGE_NAME:-ai-rich-text-editor}-elasticsearch:${ARTE_VERSION:-latest}
    profiles: ["observability"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-arte_elastic_2026}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:-arte_kibana_2026}
    entrypoint: ["bash", "-c"]
    command:
      - >-
        curl -fsS -u "elastic:$${ELASTIC_PASSWORD}"
        -X POST http://elasticsearch:9200/_security/user/kibana_system/_password
        -H 'Content-Type: application/json'
        -d "{\"password\":\"$${KIBANA_PASSWORD}\"}"

  kibana:
    image: kibana:8.13.4
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      elasticsearch-setup:
        condition: service_completed_successfully
    environment:
      SERVER_HOST: 0.0.0.0
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD:-arte_kibana_2026}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KB_ENC_KEY:-arte-encrypted-saved-objects-key-2026}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KB_REPORTING_KEY:-arte-reporting-encryption-key-2026}
      XPACK_SECURITY_ENCRYPTIONKEY: ${KB_SEC_KEY:-arte-security-encryption-key-2026}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${KIBANA_BIND_ADDRESS:-127.0.0.1}:${KIBANA_PORT:-5601}:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5601/api/status >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 45s

volumes:
  mysql-data:
  redis-data:
  es-data:
  backend-logs:
  backend-uploads:
  backend-secrets:
  content-init-state:
