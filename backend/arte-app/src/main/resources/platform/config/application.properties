# Public platform runtime configuration, filtered from backend/profile/common.properties and app.properties.
# Identity enablement requires reviewed account bindings and both manual platform DDLs.
arte.platform.identity.enabled=@arte.platform.identity.enabled@
arte.platform.identity.legacy-user-id-ceiling=@arte.platform.identity.legacy-user-id-ceiling@
arte.platform.identity.bindings[0].user-id=@arte.platform.identity.bindings[0].user-id@
arte.platform.identity.bindings[0].subject-id=@arte.platform.identity.bindings[0].subject-id@
arte.platform.persistence.enabled=@arte.platform.persistence.enabled@
arte.platform.persistence.workers=@arte.platform.persistence.workers@
arte.platform.persistence.queue-capacity=@arte.platform.persistence.queue-capacity@
arte.platform.persistence.query-timeout-seconds=@arte.platform.persistence.query-timeout-seconds@
arte.platform.persistence.transaction-timeout-seconds=@arte.platform.persistence.transaction-timeout-seconds@
arte.platform.persistence.outbox-batch-size=@arte.platform.persistence.outbox-batch-size@
arte.platform.persistence.lease=@arte.platform.persistence.lease@
arte.platform.persistence.poll-interval=@arte.platform.persistence.poll-interval@
arte.platform.persistence.retry-delay=@arte.platform.persistence.retry-delay@
arte.platform.persistence.cursor-ttl=@arte.platform.persistence.cursor-ttl@
arte.platform.persistence.redis-prefix=@arte.platform.persistence.redis-prefix@
arte.platform.persistence.outbox-enabled=@arte.platform.persistence.outbox-enabled@
arte.platform.workspace.enabled=@arte.platform.workspace.enabled@
# 4-01 preparation remains disabled until its DDL, key ring and scope policies are configured.
arte.ai-new-model-management.enabled=@arte.ai-new-model-management.enabled@
arte.ai-new-model-publication.enabled=@arte.ai-new-model-publication.enabled@
arte.ai-new-model-sharing.enabled=@arte.ai-new-model-sharing.enabled@
arte.ai-new-model-management.active-key-id=${ARTE_MODEL_ACTIVE_KEY_ID:primary}
arte.ai-new-model-management.fingerprint-key-id=${ARTE_MODEL_FINGERPRINT_KEY_ID:primary}
# Base64-encoded 16-byte SM4 key; never truncate or reuse an old AES key ID.
arte.ai-new-model-management.encryption-keys.primary=${ARTE_MODEL_CREDENTIAL_KEY:}

