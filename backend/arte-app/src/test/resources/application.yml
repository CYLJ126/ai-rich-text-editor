server:
  port: 7750
  servlet:
    context-path: /arte
logging:
  config: classpath:log4j2.xml
threadPool:
  business: # 业务线程池
    coreSize: 5
    maxSize: 10
    keepAliveTime: 300
    queueSize: 200
spring:
  application:
    name: arte
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb
    username: root
    password: root
  sql:
    init:
      schema-locations: classpath:db/schema-h2.sql
      data-locations: classpath:db/data-h2.sql
  h2:
    console:
      enabled: true
      path: /h2
# 参见 WebSecurityProperties 类
jwt:
  header: Authorization
  # 令牌前缀
  token-start-with: Bearer
  # 必须使用最少88位的Base64对该令牌进行编码
  base64-secret-key: YmEyOTE3YWJiOTdlNGRlMTllNzMwOTlmMGRkNzM0NjBkMDAyZjdhNGViNzE0NmU4OTk2YTEyNGFhZjE4YmE3Y2RkYWVlOGZkZDczMjRhMWM4ZDIwZmQ1ZDgzMDBiNGIw
  # 令牌过期时间 此处单位/毫秒 ，默认2小时，可在此网站生成 https://www.convertworld.com/zh-hans/time/milliseconds.html
  token-validity-in-seconds: 7200000
  # 在线用户key
  online-key: 'arte_online:'
  # 验证码
  code-key: 'arte_code:'
  # token 续期检查时间范围（默认30分钟，单位默认毫秒），在token即将过期的一段时间内用户操作了，则给用户的token续期
  detect: 1800000
  # 续期时间范围，默认 1小时，这里单位毫秒
  renew: 3600000
  # 默认密码
  default-password: Aa111111
# 登录相关配置
login:
  # 登录缓存
  cache-enable: true
  #  是否限制单用户登录
  single-login: true
  #  验证码
  login-code:
    #  验证码类型配置 查看 LoginProperties 类
    code-type: arithmetic
    #  登录图形验证码有效时间/分钟
    expiration: 2
    #  验证码宽度
    width: 111
    #  验证码高度
    height: 36
    # 内容长度
    length: 2
    # 字体名称，为空则使用默认字体，如遇到线上乱码，设置其他字体即可
    font-name:
    # 字体大小
    font-size: 25