# Startup defaults are filtered from backend/profile/app.properties; environment variables may override them.
arte.ai-new-search.enabled=@arte.ai-new-search.enabled@
# Requires the MySQL migration first. Initialization runs after ApplicationReady and never replaces existing aliases.
arte.ai-new-search.initialize-on-startup=@arte.ai-new-search.initialize-on-startup@
arte.ai-new-search.query-enabled=@arte.ai-new-search.query-enabled@
arte.ai-new-search.scan-enabled=@arte.ai-new-search.scan-enabled@
arte.ai-new-search.backfill-enabled=@arte.ai-new-search.backfill-enabled@
arte.ai-new-search.reconcile-enabled=@arte.ai-new-search.reconcile-enabled@
arte.ai-new-search.index.read-alias=conversation-search-read
arte.ai-new-search.index.write-alias=conversation-search-write
arte.ai-new-search.index.generation-prefix=conversation-search-v2
# Primary IK smart stays symmetric. v2 also adds max_word recall and a low-boost literal phrase subfield; rebuild required.
arte.ai-new-search.index.index-tokenizer=ik_smart
arte.ai-new-search.index.query-tokenizer=ik_smart
arte.ai-new-search.index.rules-version=v2
arte.ai-new-search.index.expected-server-version=9.4.2
arte.ai-new-search.index.expected-ik-version=9.4.2
arte.ai-new-search.index.shards=1
arte.ai-new-search.index.replicas=1
arte.ai-new-search.session.namespace=${ARTE_AI_NEW_SEARCH_REDIS_NAMESPACE:arte:ai-new:conversation-search:v1}
arte.ai-new-search.session.idle-timeout=10m
arte.ai-new-search.session.max-lifetime=30m
arte.ai-new-search.session.max-per-subject=3
arte.ai-new-search.session.redis-timeout=2s
arte.ai-new-search.limits.max-page-size=20
arte.ai-new-search.limits.candidate-budget=100
arte.ai-new-search.limits.max-es-requests=5
arte.ai-new-search.limits.request-timeout=3s
arte.ai-new-search.limits.preview-max-chars=800
arte.ai-new-search.limits.io-threads=2
arte.ai-new-search.limits.queued-tasks=1000
# \u521D\u59CB\u5316\u6216\u540E\u53F0\u626B\u63CF\u5747\u8981\u6C42\u56FA\u5B9A\u7269\u7406\u4EE3\u9645\uFF1B\u521D\u59CB\u5316\u5173\u95ED\u65F6\u987B\u9884\u5148\u624B\u52A8\u521B\u5EFA\uFF0C\u4E0D\u8DDF\u968F alias \u5199\u5165\u3002
arte.ai-new-search.sync.generation=@arte.ai-new-search.sync.generation@
arte.ai-new-search.sync.tick=250ms
arte.ai-new-search.sync.idle-max=${ARTE_AI_NEW_SEARCH_IDLE_MAX:5s}
arte.ai-new-search.sync.tick-budget=2s
arte.ai-new-search.sync.batch-size=20
arte.ai-new-search.sync.work-per-tick=10
arte.ai-new-search.sync.lease=60s
arte.ai-new-search.sync.reconcile-interval=1h
arte.ai-new-search.sync.retry-initial=2s
arte.ai-new-search.sync.retry-max=5m
arte.ai-new-search.sync.error-threshold=10
# Only background SQL detail is muted; failed and slow SQL remain visible without bound parameters.
arte.ai-new-search.diagnostics.sql-enabled=${ARTE_AI_NEW_SEARCH_SQL_ENABLED:false}
arte.ai-new-search.diagnostics.slow-sql-threshold=${ARTE_AI_NEW_SEARCH_SLOW_SQL_THRESHOLD:500ms}
