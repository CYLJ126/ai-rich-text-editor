# 数据库控制面部署示例；需由宿主提供数据库配置来源及当前授权解析器。
# 模型、连接、费率、预算和成员资格在管理界面配置，不从文件加载。
# 仅保存凭据引用和环境变量名称。预算仍由 BudgetAccountInitializer 显式初始化。
arte:
  ai-new:
    enabled: true
    data-source-bean: appDataSource
    release-ref: example-release-v1
    persistence:
      threads: 4
      queued-tasks: 256
    limits:
      max-input-bytes: 65536
      max-output-tokens: 4096
      max-output-bytes: 1048576
      maximum-timeout: 2m
      snapshot-retention: 15m
  ai-new-http:
    model:
      max-pools: 32
      connections-per-pool: 8
      pending-acquires: 32
      acquire-timeout: 5s
      max-in-memory-bytes: 65536
  ai-new-generation:
    enabled: true
    secrets:
      - reference: {type: secret, id: example-credential, version: v1}
        environment-variable: ARTE_DEEPSEEK_API_KEY
