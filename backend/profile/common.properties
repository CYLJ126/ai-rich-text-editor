# Spring \u5E94\u7528\u914D\u7F6E
spring.application.name=AIRichTextEditor
# \u65E5\u5FD7\u914D\u7F6E
logging.config=classpath:log4j2.xml
log.path=/usr/local/data/log/AIRichTextEditor
log.fileName=AIRichTextEditor
# \u4E1A\u52A1\u7EBF\u7A0B\u6C60\u914D\u7F6E
threadPool.business.coreSize=5
threadPool.business.maxSize=50
threadPool.business.keepAliveTime=300
threadPool.business.queueSize=1024
# ============= Druid \u6570\u636E\u6E90\u914D\u7F6E start =============
spring.datasource.druid.db-type=com.alibaba.druid.pool.DruidDataSource
# \u6700\u5C0F\u8FDE\u63A5\u6570
spring.datasource.druid.min-idle=5
# \u6700\u5927\u8FDE\u63A5\u6570
spring.datasource.druid.max-active=10
# \u8FDE\u63A5\u6709\u6548\u6027\u68C0\u6D4B\u65F6\u95F4
spring.datasource.druid.time-between-eviction-runs-millis=60000
# \u8FDE\u63A5\u5728\u6C60\u4E2D\u6700\u5C0F\u751F\u5B58\u7684\u65F6\u95F4
spring.datasource.druid.min-evictable-idle-time-millis=300000
# \u8FDE\u63A5\u5728\u6C60\u4E2D\u6700\u5927\u751F\u5B58\u7684\u65F6\u95F4
spring.datasource.druid.max-evictable-idle-time-millis=900000
spring.datasource.druid.test-while-idle=true
spring.datasource.druid.test-on-borrow=false
spring.datasource.druid.test-on-return=false
# \u68C0\u6D4B\u8FDE\u63A5\u662F\u5426\u6709\u6548
spring.datasource.druid.validation-query=select 1
# \u914D\u7F6E\u76D1\u63A7\u7EDF\u8BA1
spring.datasource.druid.webStatFilter.enabled=true
spring.datasource.druid.stat-view-servlet.enabled=true
spring.datasource.druid.stat-view-servlet.url-pattern=/druid/*
spring.datasource.druid.stat-view-servlet.reset-enable=false
spring.datasource.druid.stat-view-servlet.login-username=admin
spring.datasource.druid.stat-view-servlet.login-password=be83ea12
spring.datasource.druid.filter.stat.enabled=true
# \u8BB0\u5F55\u6162SQL
spring.datasource.druid.filter.stat.log-slow-sql=true
spring.datasource.druid.filter.stat.slow-sql-millis=1000
spring.datasource.druid.filter.stat.merge-sql=true
spring.datasource.druid.filter.wall.config.multi-statement-allow=true
# \u83B7\u53D6\u8FDE\u63A5\u8D85\u65F6\u65F6\u95F4
spring.datasource.druid.max-wait=5000
# ============= Druid \u6570\u636E\u6E90\u914D\u7F6E end =============
# ============= \u7F13\u5B58 \u6570\u636E\u6E90\u914D\u7F6E start =============
cache.cache-type=redis
# \u7F13\u5B58\u626B\u63CF\u5305\uFF0C\u591A\u4E2A\u5305\u7528\u82F1\u6587\u9017\u53F7\u5206\u9694
cache.scan-packages=com.arte.app.pojo,com.arte.ai.pojo.model
cache.default.expire=60000
cache.default.max-size=65536
cache.default.cache-key-prefix=ARTE
# ============= \u7F13\u5B58 \u6570\u636E\u6E90\u914D\u7F6E end =============
# JWT \u914D\u7F6E
# \u53C2\u89C1 WebSecurityProperties \u7C7B
jwt.header=Authorization
# \u4EE4\u724C\u524D\u7F00
jwt.token-start-with=Bearer
# \u5FC5\u987B\u4F7F\u7528\u6700\u5C1188\u4F4D\u7684Base64\u5BF9\u8BE5\u4EE4\u724C\u8FDB\u884C\u7F16\u7801
jwt.base64-secret-key=3LQ9b6V0dgGihq1sMyNDcJM0XXXH4PZQYjYpNRvyKV5Q2xSeeuWznSB+K+8hH4KQmmdamqbfIRkU0jKhnvNlcb9b
# \u4EE4\u724C\u8FC7\u671F\u65F6\u95F4 \u6B64\u5904\u5355\u4F4D/\u6BEB\u79D2 \uFF0C\u9ED8\u8BA4 2 \u5C0F\u65F6\uFF0C\u53EF\u5728\u6B64\u7F51\u7AD9\u751F\u6210 https://www.convertworld.com/zh-hans/time/milliseconds.html
jwt.token-validity-in-seconds=7200000
# \u5728\u7EBF\u7528\u6237key
jwt.online-key='arte_online:'
# \u9A8C\u8BC1\u7801
jwt.code-key='arte_code:'
# token \u7EED\u671F\u68C0\u67E5\u65F6\u95F4\u8303\u56F4\uFF08\u9ED8\u8BA4 30 \u5206\u949F\uFF0C\u5355\u4F4D\u9ED8\u8BA4\u6BEB\u79D2\uFF09\uFF0C\u5728 token \u5373\u5C06\u8FC7\u671F\u7684\u4E00\u6BB5\u65F6\u95F4\u5185\u7528\u6237\u64CD\u4F5C\u4E86\uFF0C\u5219\u7ED9\u7528\u6237\u7684 token \u7EED\u671F
jwt.detect=1800000
# \u7EED\u671F\u65F6\u95F4\u8303\u56F4\uFF0C\u9ED8\u8BA4 1 \u5C0F\u65F6\uFF0C\u8FD9\u91CC\u5355\u4F4D\u6BEB\u79D2
jwt.renew=3600000
# \u9ED8\u8BA4\u5BC6\u7801
jwt.default-password=arte@2026
# \u767B\u5F55\u76F8\u5173\u914D\u7F6E
# \u767B\u5F55\u7F13\u5B58
login.cache-enable=true
# \u662F\u5426\u9650\u5236\u5355\u7528\u6237\u767B\u5F55
login.single-login=true
# \u9A8C\u8BC1\u7801\u7C7B\u578B\u914D\u7F6E \u67E5\u770B LoginProperties \u7C7B
login.login-code.code-type=arithmetic
# \u767B\u5F55\u56FE\u5F62\u9A8C\u8BC1\u7801\u6709\u6548\u65F6\u95F4/\u5206\u949F
login.login-code.expiration=2
# \u9A8C\u8BC1\u7801\u5BBD\u5EA6
login.login-code.width=111
# \u9A8C\u8BC1\u7801\u9AD8\u5EA6
login.login-code.height=36
# \u5185\u5BB9\u957F\u5EA6
login.login-code.length=2
# \u5B57\u4F53\u540D\u79F0\uFF0C\u4E3A\u7A7A\u5219\u4F7F\u7528\u9ED8\u8BA4\u5B57\u4F53\uFF0C\u5982\u9047\u5230\u7EBF\u4E0A\u4E71\u7801\uFF0C\u8BBE\u7F6E\u5176\u4ED6\u5B57\u4F53\u5373\u53EF
login.login-code.font-name=
# \u5B57\u4F53\u5927\u5C0F
login.login-code.font-size=25
# Advanced public platform persistence defaults. Override only the needed keys in app.properties.
arte.platform.persistence.workers=8
arte.platform.persistence.queue-capacity=128
arte.platform.persistence.query-timeout-seconds=5
arte.platform.persistence.transaction-timeout-seconds=15
arte.platform.persistence.outbox-batch-size=50
arte.platform.persistence.lease=30s
arte.platform.persistence.poll-interval=1s
arte.platform.persistence.retry-delay=5s
arte.platform.persistence.cursor-ttl=10m
arte.platform.persistence.redis-prefix=arte:platform:
# AI \u4E13\u7528\u7684\u963B\u585E JDBC \u8C03\u5EA6\u5668\u914D\u7F6E
arte.ai-new.persistence.threads=4
arte.ai-new.persistence.queued-tasks=256
# AI \u6267\u884C\u7684\u7EDF\u4E00\u8FB9\u754C
arte.ai-new.limits.max-input-bytes=65536
arte.ai-new.limits.max-output-tokens=4096
arte.ai-new.limits.max-output-bytes=1048576
arte.ai-new.limits.maximum-timeout=2m
arte.ai-new.limits.workspaceSnapshot-retention=15m
# AI \u6A21\u578B HTTP \u8FDE\u63A5\u6C60
arte.ai-new-generation.max-pools=32
arte.ai-new-generation.connections-per-pool=8
arte.ai-new-generation.pending-acquires=32
arte.ai-new-generation.acquire-timeout=5s

# AI SSE notification transport (reuse application RedissonClient).
# Existing databases opt in through app.properties only after metadata DDL is ready.
arte.ai-new.conversation-metadata-backfill.enabled=false
arte.ai-new-model-management.enabled=false
arte.ai-new-model-publication.enabled=false
# \u7B2C\u56DB\u6279\uFF1A\u5B89\u88C5\u79DF\u6237\u6A21\u578B\u5171\u4EAB\u8868\u5E76\u5347\u7EA7\u5168\u90E8 API/Worker \u540E\u663E\u5F0F\u5F00\u542F\u3002
arte.ai-new-model-sharing.enabled=false
# TOOL is opt-in; startup discovery requires its own flag and never publishes tools.
arte.ai-new-tool.enabled=false
arte.ai-new-tool.discovery.source-timeout=10s
arte.ai-new-tool.discovery.refresh-on-startup=false
# Tool chat is independently opt-in after the Run/history/budget migrations and node upgrade.
arte.ai-new-tool-chat.enabled=false
arte.ai-new-tool-chat.worker-enabled=false
arte.ai-new-tool-chat.poll-interval=1s
arte.ai-new-tool-chat.lease=45s
arte.ai-new-tool-chat.batch-size=8
# Business writes and approval recovery require explicit environment opt-in.
arte.ai-new-tool-write.enabled=false
arte.ai-new-tool-approval.enabled=false
arte.ai-new-events.transport=local
arte.ai-new-events.channel=arte:ai-new:events:v1
arte.ai-new-events.publish-timeout=3s
# Shared dispatch limits and safe retry (max-attempts includes the first attempt).
arte.ai-new-execution.dispatch-limits.enabled=true
arte.ai-new-execution.dispatch-limits.global-concurrency=16
arte.ai-new-execution.dispatch-limits.tenant-concurrency=8
arte.ai-new-execution.dispatch-limits.user-concurrency=2
arte.ai-new-execution.dispatch-limits.model-concurrency=8
arte.ai-new-execution.dispatch-limits.global-requests=120
arte.ai-new-execution.dispatch-limits.tenant-requests=60
arte.ai-new-execution.dispatch-limits.user-requests=20
arte.ai-new-execution.dispatch-limits.model-requests=60
arte.ai-new-execution.dispatch-limits.window=1m
arte.ai-new-execution.retry.max-attempts=3
arte.ai-new-execution.retry.initial-backoff=1s
arte.ai-new-execution.retry.max-backoff=10s
# S2-06: deploy scheduling migration and drain legacy DISPATCH first; then enable on every worker.
# When enabled set arte.ai-new-execution.concurrency=6 (2 generation + 2 short + 1 long + 1 reserved outcome).
# tool-manifest is the reviewed StaticToolDiscovery snapshot SHA-256; empty means no TOOL readiness.
arte.ai-new-execution.scheduling.enabled=false
arte.ai-new-execution.scheduling.slots.generation=2
arte.ai-new-execution.scheduling.slots.tool-short=2
arte.ai-new-execution.scheduling.slots.tool-long=1
arte.ai-new-execution.scheduling.slots.outcome-check=1
arte.ai-new-execution.scheduling.generation-concurrency=16
arte.ai-new-execution.scheduling.short-concurrency=16
arte.ai-new-execution.scheduling.long-concurrency=8
arte.ai-new-execution.scheduling.outcome-concurrency=4
arte.ai-new-execution.scheduling.workspace-concurrency=2
arte.ai-new-execution.scheduling.provider-concurrency=8
arte.ai-new-execution.scheduling.max-queued=1000
arte.ai-new-execution.scheduling.generation-queued=300
arte.ai-new-execution.scheduling.short-queued=500
arte.ai-new-execution.scheduling.long-queued=100
arte.ai-new-execution.scheduling.outcome-queued=100
arte.ai-new-execution.scheduling.workspace-queued=100
arte.ai-new-execution.scheduling.subject-queued=20
arte.ai-new-execution.scheduling.short-threshold=10s
arte.ai-new-execution.scheduling.short-queue-timeout=10s
arte.ai-new-execution.scheduling.long-queue-timeout=30s
arte.ai-new-execution.scheduling.tool-manifest=
# S5-01: reviewed anonymous HTTP GET tool, independently disabled by default.
arte.ai-new-tool-http.enabled=false
arte.ai-new-tool-http.version=v1
arte.ai-new-tool-http.endpoint=
arte.ai-new-tool-http.allowed-origins=
# S5-02: apply billing migration and upgrade consumers before enabling.
arte.ai-new-tool-billing.enabled=false
# S5-03: reviewed MCP Streamable HTTP health tool; enable only after consumer/manifest upgrade.
arte.ai-new-tool-mcp.enabled=true
arte.ai-new-tool-mcp.version=v1
# Temporary health placeholder: metadata only; do not publish or invoke this tool.
arte.ai-new-tool-mcp.endpoint=https://mcp-health.invalid/mcp
arte.ai-new-tool-mcp.allowed-origins=https://mcp-health.invalid,https://mcp.api-inference.modelscope.net
