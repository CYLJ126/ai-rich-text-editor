# S5-02 \u5DE5\u5177\u8BA1\u8D39\u3002\u5E94\u7528\u8BA1\u8D39\u8FC1\u79FB\u5E76\u5347\u7EA7\u6D88\u8D39\u8005\u540E\u518D\u542F\u7528
arte.ai-new-tool-billing.enabled=false
# S5-03 \u5DF2\u5BA1\u6838\u7684 MCP Streamable HTTP \u5065\u5EB7\u68C0\u67E5\u5DE5\u5177\u3002\u542F\u7528\u524D\u5347\u7EA7\u6D88\u8D39\u8005\u5E76\u6838\u5BF9\u6E05\u5355
arte.ai-new-tool-mcp.enabled=true
arte.ai-new-tool-mcp.version=v1
# \u4E34\u65F6\u5065\u5EB7\u68C0\u67E5\u5360\u4F4D\u5730\u5740\uFF0C\u4EC5\u7528\u4E8E\u53D1\u73B0\u5143\u6570\u636E\u3002\u5B9E\u9645\u53D1\u5E03\u548C\u8C03\u7528\u524D\u9700\u6539\u6210\u5DF2\u5BA1\u6838\u7684\u7AEF\u70B9
