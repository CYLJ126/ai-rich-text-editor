# 仅显式使用 --spring.config.additional-location=file:... 时生效。
# 先将完整开发库恢复至本机隔离实例并校验账户、权限、会话及预算，再切换当前服务。
# 不修改 app.properties；去掉额外配置后恢复原云库连接，新写入不会自动同步回云库。
spring.datasource.druid.app.url=${ARTE_AI_LOCAL_DB_URL:jdbc:mysql://127.0.0.1:13306/arte?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.druid.app.username=${ARTE_AI_LOCAL_DB_USER:arte}
spring.datasource.druid.app.password=${ARTE_AI_LOCAL_DB_PASSWORD}
spring.datasource.druid.app.initial-size=5
spring.datasource.druid.app.min-idle=5
spring.datasource.druid.app.max-active=10
spring.datasource.druid.app.test-on-borrow=false
spring.datasource.druid.app.test-on-return=false
